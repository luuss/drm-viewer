[project]
name = "drm-tile-service"
version = "0.1.0"
description = "Stateless DRM tile renderer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pillow>=11.0",
    # Liegen die Seitenbilder im Eimer statt in der Convex-Ablage, holt dieser
    # Dienst sie selbst — Convex hat dafuer keine Adresse.
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
