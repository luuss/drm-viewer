name: Validate and deploy Convex

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test Convex functions
        run: |
          npm ci
          npm test

      - name: Build web application
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          test -n "$VITE_CONVEX_URL"
          npm ci --prefix web
          npm run build --prefix web

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extract-service/requirements.txt

      - name: Test extraction service
        run: |
          python -m pip install --disable-pip-version-check -r extract-service/requirements.txt pytest
          python -m pytest -q extract-service/tests

      - name: Validate Dokploy Compose
        env:
          PUBLIC_WEB_ORIGIN: https://digital.example.test
          VITE_CONVEX_URL: https://example.convex.cloud
          CONVEX_SITE_URL: https://example.convex.site
          TILE_SERVICE_SECRET: validation-only
          EXTRACT_SERVICE_SECRET: validation-only
        run: docker compose -f docker-compose.dokploy.yml config --quiet

  deploy-convex:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy Convex production functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::notice::CONVEX_DEPLOY_KEY fehlt; Validierung erfolgreich, Convex-Deploy uebersprungen."
            exit 0
          fi
          npm ci
          npx convex deploy --typecheck enable --message "GitHub ${GITHUB_SHA}"
