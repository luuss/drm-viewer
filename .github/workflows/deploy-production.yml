name: Pruefen und ausliefern

# Ein Push auf main liefert aus, aber nur wenn alle Pruefungen bestehen.
# Reihenfolge ist wichtig: erst das Backend, dann die Dienste. Andersherum
# zeigt eine frische Oberflaeche auf Funktionen, die es noch nicht gibt.
#
# Dokploy hat deshalb KEINEN eigenen Auto-Deploy mehr. Wuerde es bei jedem Push
# selbst starten, liefe es an den Tests vorbei und rote Tests wuerden ein
# kaputtes Deployment nicht aufhalten.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    name: Tests und Bau
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Vite benennt das Bundle nach dem Inhalt. Damit laesst sich spaeter
      # feststellen, ob die Seite wirklich den neuen Stand ausliefert.
      bundle: ${{ steps.bauen.outputs.bundle }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      # Faellt hier auf, nicht erst beim Ausliefern: `convex deploy` prueft die
      # Typen mit derselben Konfiguration und bricht sonst ab.
      - name: Convex-Funktionen typpruefen
        run: npx tsc --noEmit -p convex

      - name: Convex-Funktionen testen
        run: npm test

      - name: Weboberflaeche bauen
        id: bauen
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [[ -z "$VITE_CONVEX_URL" ]]; then
            echo "::error::Repository-Variable VITE_CONVEX_URL fehlt."
            exit 1
          fi
          npm ci --prefix web
          npm run build --prefix web
          bundle=$(grep -oE 'src="[^"]+\.js"' web/dist/index.html | head -1 | cut -d'"' -f2)
          echo "Erwartetes Bundle: $bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extract-service/requirements.txt

      - name: Extraktion testen
        run: |
          python -m pip install --disable-pip-version-check -r extract-service/requirements.txt pytest
          python -m pytest -q extract-service/tests

      - name: Compose-Datei pruefen
        env:
          PUBLIC_WEB_ORIGIN: https://digital.example.test
          VITE_CONVEX_URL: https://example.convex.cloud
          CONVEX_SITE_URL: https://example.convex.site
          TILE_SERVICE_SECRET: nur-zur-pruefung
          EXTRACT_SERVICE_SECRET: nur-zur-pruefung
        run: docker compose -f docker-compose.dokploy.yml config --quiet

  ausliefern:
    name: Backend und Dienste ausliefern
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Fehlt ein Zugang, bricht der Lauf ab. Frueher wurde der Schritt still
      # uebersprungen und der Lauf trotzdem gruen gemeldet — das Backend blieb
      # dann alt, ohne dass irgendwo etwas auffiel.
      - name: Zugaenge pruefen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          fehlt=0
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY fehlt. Neu erzeugen mit: npx convex deployment token create github-actions"
            fehlt=1
          fi
          if [[ -z "$DOKPLOY_DEPLOY_URL" ]]; then
            echo "::error::Secret DOKPLOY_DEPLOY_URL fehlt. Es ist die Deploy-Webhook-Adresse des Compose-Dienstes in Dokploy."
            fehlt=1
          fi
          exit $fehlt

      - name: Convex-Funktionen ausliefern
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npm ci
          npx convex deploy --typecheck enable --message "GitHub ${GITHUB_SHA::7}"

      # Erst jetzt die Dienste: die Oberflaeche darf nie vor dem Backend neu
      # sein, sonst ruft sie Funktionen auf, die es noch nicht gibt.
      - name: Dienste in Dokploy neu ausrollen
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          # Dokploy erwartet an diesem Eingang einen Aufruf in der Form, die
          # GitHub selbst schickt: das Ereignis im Kopf und den Zweig im Rumpf.
          # Fehlt eines davon, antwortet es "Branch Not Match" — und zwar mit
          # Code 301, den curl nicht als Fehler wertet. Deshalb wird hier der
          # Rumpf ausgewertet und nicht nur der Code.
          code=$(curl --silent --show-error --max-time 60 \
                      --output /tmp/dokploy.out --write-out '%{http_code}' \
                      -X POST "$DOKPLOY_DEPLOY_URL" \
                      -H 'Content-Type: application/json' \
                      -H 'x-github-event: push' \
                      -d "{\"ref\":\"${GITHUB_REF:-refs/heads/main}\"}")
          antwort=$(cat /tmp/dokploy.out 2>/dev/null || true)
          echo "Antwort ($code): $antwort"
          if [[ "$code" != "200" ]] || ! grep -qi "successfully" /tmp/dokploy.out; then
            echo "::error::Dokploy hat den Auftrag nicht angenommen: $antwort"
            exit 1
          fi

      # Der Webhook bestaetigt nur die Annahme, nicht den Erfolg. Deshalb wird
      # danach die laufende Seite selbst befragt.
      # Der Webhook bestaetigt nur die Annahme, nicht den Erfolg. Ohne die
      # folgende Pruefung waere der Lauf schon nach Sekunden gruen — und haette
      # dabei nur den alten, noch laufenden Stand bestaetigt.
      - name: Warten bis der neue Stand ausgeliefert wird
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          ERWARTET: ${{ needs.pruefen.outputs.bundle }}
        run: |
          basis="${PUBLIC_WEB_ORIGIN:-https://d.chuk.dev}"
          echo "Erwartet wird $ERWARTET auf $basis"

          # Dokploy baut drei Images neu; das dauert einige Minuten.
          for versuch in $(seq 1 90); do
            geliefert=$(curl -s --max-time 10 "$basis/" \
                        | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2 || true)
            if [[ -n "$ERWARTET" && "$geliefert" == "$ERWARTET" ]]; then
              echo "Neuer Stand steht nach $((versuch * 10)) s."
              fertig=ja
              break
            fi
            sleep 10
          done

          if [[ "${fertig:-nein}" != "ja" ]]; then
            echo "::error::Nach 15 Minuten liefert $basis noch '$geliefert' statt '$ERWARTET'. Der Bau in Dokploy ist vermutlich fehlgeschlagen; Protokoll dort pruefen."
            exit 1
          fi

      - name: Rauchtest an der ausgelieferten Seite
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
          ERWARTETE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          basis="${PUBLIC_WEB_ORIGIN:-https://d.chuk.dev}"

          gesund=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$basis/api/health" || echo 000)
          if [[ "$gesund" != "200" ]]; then
            echo "::error::Das Kachel-Gateway antwortet nicht (HTTP $gesund). Ohne es bleibt die Seitenansicht leer."
            exit 1
          fi

          # Ein abgebrochener Bau hinterlaesst eine index.html, deren Bundle
          # fehlt. Das faellt sonst erst dem Leser auf.
          bundle=$(curl -s --max-time 10 "$basis/" | grep -oE 'src="[^"]+\.js"' | head -1 | cut -d'"' -f2)
          bundle_code=$(curl -s -o /tmp/bundle.js -w '%{http_code}' --max-time 30 "$basis$bundle")
          if [[ "$bundle_code" != "200" ]]; then
            echo "::error::Das Bundle $bundle fehlt (HTTP $bundle_code)."
            exit 1
          fi

          # Zeigt die Oberflaeche auf das erwartete Backend?
          if [[ -n "$ERWARTETE_CONVEX_URL" ]] && ! grep -qF "$ERWARTETE_CONVEX_URL" /tmp/bundle.js; then
            echo "::error::Die ausgelieferte Oberflaeche zeigt nicht auf $ERWARTETE_CONVEX_URL."
            exit 1
          fi

          echo "Rauchtest bestanden: neuer Stand, Kacheldienst erreichbar, Bundle vollstaendig, Backend-Adresse stimmt."
