# Plesk-Direktiven fuer digital.weltkrieg-online.de (HTTPS), die zweite Anlage
# des Lesers (docker-compose.weltkrieg.yml). Aufbau wie digital.vhost_ssl.conf,
# nur andere Ports: Oberflaeche 8091, Convex 3220/3221, MinIO 9012.
# Ablage:  /var/www/vhosts/system/digital.weltkrieg-online.de/conf/vhost_ssl.conf
# Danach:  plesk sbin httpdmng --reconfigure-domain digital.weltkrieg-online.de
# Kein Cloudflare davor (weltkrieg-online.de zeigt direkt auf den Server).

ProxyPreserveHost On
ProxyTimeout 300
RequestHeader set X-Forwarded-Proto "https"
# Echte Besucher-IP fuer Convex (Anmelde-Sperre je IP, convex/magicLink.ts).
# REMOTE_ADDR ist dank mod_remoteip die Besucher-IP, auch hinter Cloudflare;
# "set" ueberschreibt, was der Besucher selbst schickt (Pruefung 03.11.2026).
RequestHeader set X-Echte-IP "expr=%{REMOTE_ADDR}"

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Apple Pay: Domain-Datei fuer Stripe liegt in der Oberflaeche (web/public)
    RewriteRule ^/?\.well-known/apple-developer-merchantid-domain-association$ http://127.0.0.1:8091/.well-known/apple-developer-merchantid-domain-association [P,L]

    # Plesk-eigene Pfade und ACME nie proxen
    RewriteCond %{REQUEST_URI} ^/(\.well-known|plesk-stat|webstat|webstat-ssl|ftpstat|error_docs)(/|$) [NC]
    RewriteRule ^ - [L]

    # Convex-Synchronisation (WebSocket)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?convex/(.*)$ ws://127.0.0.1:3220/$1 [P,QSA,L]

    # Convex-Anwendung
    RewriteRule ^/?convex/(.*)$ http://127.0.0.1:3220/$1 [P,QSA,L]

    # Medienspeicher (MinIO) fuer Browser-Uploads. Vorsignierte Adressen sind
    # ueber Host und Pfad unterschrieben: Host bleibt (ProxyPreserveHost), der
    # Vorsatz /medien faellt weg, und genau so rechnet convex/s3Presign.ts.
    RewriteRule ^/?medien/(.*)$ http://127.0.0.1:9012/$1 [P,QSA,L]

    # Convex-HTTP-Routen (Stripe, Shop, Worker)
    RewriteRule ^/?hooks/(.*)$ http://127.0.0.1:3221/$1 [P,QSA,L]

    # Convex ohne Praefix. Node-Aktionen rufen fuer ctx.runQuery & Co.
    # CONVEX_CLOUD_ORIGIN ohne /convex auf (POST /api/actions/query), CLI und
    # Dashboard ebenso (/api/get_config_hashes, /api/sync). Dem Kachel-Gateway
    # gehoeren nur /api/session, /api/health, /api/issue/, /api/asset/ und /api/schrift/ —
    # alles andere unter /api geht an Convex.
    RewriteCond %{REQUEST_URI} !^/api/(session|health)$
    RewriteCond %{REQUEST_URI} !^/api/(issue|asset|schrift)/
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(api/.*)$ ws://127.0.0.1:3220/$1 [P,QSA,L]
    RewriteCond %{REQUEST_URI} !^/api/(session|health)$
    RewriteCond %{REQUEST_URI} !^/api/(issue|asset|schrift)/
    RewriteRule ^/?(api/.*)$ http://127.0.0.1:3220/$1 [P,QSA,L]

    # alles andere: Oberflaeche + /api (Kachel-Gateway)
    RewriteRule ^/?(.*)$ http://127.0.0.1:8091/$1 [P,QSA,L]
</IfModule>

# CROWDSEC BEGIN (server-wide ban rule in /etc/apache2/conf-enabled/zz-crowdsec.conf needs RewriteEngine on here)
<IfModule mod_rewrite.c>
	RewriteEngine On
</IfModule>
# CROWDSEC END
