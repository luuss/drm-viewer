# Plesk-Direktiven fuer medien.lesen.lesenundschenken.de (HTTPS) -> MinIO.
# Ablage:  /var/www/vhosts/system/medien.lesen.lesenundschenken.de/conf/vhost_ssl.conf
# Danach:  plesk sbin httpdmng --reconfigure-domain medien.lesen.lesenundschenken.de
#
# Eigener Name ohne Praefix: vorsignierte URLs sind ueber Host und Pfad
# unterschrieben. Deshalb Host durchreichen und den Pfad nicht anfassen.

ProxyPreserveHost On
ProxyTimeout 600
RequestHeader set X-Forwarded-Proto "https"
LimitRequestBody 0

<IfModule mod_rewrite.c>
    RewriteEngine On

    RewriteCond %{REQUEST_URI} ^/(\.well-known|plesk-stat|webstat|webstat-ssl|ftpstat|error_docs)(/|$) [NC]
    RewriteRule ^ - [L]

    RewriteRule ^/?(.*)$ http://127.0.0.1:9002/$1 [P,QSA,L]
</IfModule>
