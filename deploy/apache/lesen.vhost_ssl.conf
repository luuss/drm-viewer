# Plesk-Direktiven fuer lesen.lesenundschenken.de (HTTPS).
# Ablage:  /var/www/vhosts/system/lesen.lesenundschenken.de/conf/vhost_ssl.conf
# Danach:  plesk sbin httpdmng --reconfigure-domain lesen.lesenundschenken.de
#
# Ein Name fuer drei Dienste; Convex bekommt Praefixe, weil /api schon dem
# Kachel-Gateway (in web) gehoert. Die Praefixe werden hier abgeschnitten.

ProxyPreserveHost On
ProxyTimeout 300
RequestHeader set X-Forwarded-Proto "https"

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Apple Pay: Domain-Datei fuer Stripe liegt in der Oberflaeche (web/public)
    RewriteRule ^/?\.well-known/apple-developer-merchantid-domain-association$ http://127.0.0.1:8090/.well-known/apple-developer-merchantid-domain-association [P,L]

    # Plesk-eigene Pfade und ACME nie proxen
    RewriteCond %{REQUEST_URI} ^/(\.well-known|plesk-stat|webstat|webstat-ssl|ftpstat|error_docs)(/|$) [NC]
    RewriteRule ^ - [L]

    # Convex-Synchronisation (WebSocket)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?convex/(.*)$ ws://127.0.0.1:3210/$1 [P,QSA,L]

    # Convex-Anwendung
    RewriteRule ^/?convex/(.*)$ http://127.0.0.1:3210/$1 [P,QSA,L]

    # Medienspeicher (MinIO) fuer Browser-Uploads. Vorsignierte Adressen sind
    # ueber Host und Pfad unterschrieben: Host bleibt (ProxyPreserveHost), der
    # Vorsatz /medien faellt weg, und genau so rechnet convex/s3Presign.ts.
    # Eigener Name ging nicht: medien.lesen.lesenundschenken.de liegt zwei
    # Ebenen tief, Cloudflares Zertifikat deckt nur *.lesenundschenken.de.
    RewriteRule ^/?medien/(.*)$ http://127.0.0.1:9002/$1 [P,QSA,L]

    # Convex-HTTP-Routen (Stripe, Shop, Worker)
    RewriteRule ^/?hooks/(.*)$ http://127.0.0.1:3211/$1 [P,QSA,L]

    # Convex ohne Praefix. Node-Aktionen rufen fuer ctx.runQuery & Co.
    # CONVEX_CLOUD_ORIGIN ohne /convex auf (POST /api/actions/query), CLI und
    # Dashboard ebenso (/api/get_config_hashes, /api/sync). Dem Kachel-Gateway
    # gehoeren nur /api/session, /api/health, /api/issue/ und /api/asset/ —
    # alles andere unter /api geht an Convex.
    RewriteCond %{REQUEST_URI} !^/api/(session|health)$
    RewriteCond %{REQUEST_URI} !^/api/(issue|asset)/
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(api/.*)$ ws://127.0.0.1:3210/$1 [P,QSA,L]
    RewriteCond %{REQUEST_URI} !^/api/(session|health)$
    RewriteCond %{REQUEST_URI} !^/api/(issue|asset)/
    RewriteRule ^/?(api/.*)$ http://127.0.0.1:3210/$1 [P,QSA,L]

    # alles andere: Oberflaeche + /api (Kachel-Gateway)
    RewriteRule ^/?(.*)$ http://127.0.0.1:8090/$1 [P,QSA,L]
</IfModule>
