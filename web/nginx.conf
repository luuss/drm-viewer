server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/health {
        proxy_pass http://tile-service:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eine oeffentliche Domain: Browser-Anfragen an /api werden intern an das
    # Kachel-Gateway weitergereicht. Port 8000 bleibt im Docker-Netz.
    location /api/ {
        proxy_pass http://tile-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Die Typentabelle von nginx kennt `.mjs` nicht und liefert die Datei als
    # application/octet-stream aus. Ein Browser lehnt ein Modul mit diesem Typ
    # ab ("Strict MIME type checking"), und pdf.js faellt auf seinen Notbetrieb
    # im Hauptfaden zurueck — Seiten rendern dann um ein Vielfaches langsamer.
    # Nur fuer diese Endung, damit die uebrige Typentabelle unberuehrt bleibt:
    # ein `types`-Block ersetzt sie auf seiner Ebene vollstaendig.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cache for index so Convex/tile URLs swap cleanly on redeploy
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
