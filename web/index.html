<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesen &amp; Schenken Digital</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#111318" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Notbremse fuer zu alte Browser (z. B. iPhone vor iOS 15): laedt das
      // Programm nicht, steht nach 12 s ein Hinweis statt einer weissen Seite.
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && !r.firstChild) {
          r.innerHTML =
            '<div style="font:16px/1.5 system-ui,-apple-system,sans-serif;max-width:32em;margin:15vh auto;padding:0 20px;color:#222">' +
            "<h1 style=\"font-size:22px\">Die Seite konnte nicht geladen werden</h1>" +
            "<p>Ihr Browser ist vermutlich zu alt. Bitte aktualisieren Sie Ihr Ger\u00e4t " +
            "(iPhone: Einstellungen \u2192 Allgemein \u2192 Softwareupdate) oder \u00f6ffnen Sie die Seite in einem anderen Browser.</p>" +
            '<p><a href="" style="color:#8a1c1c">Seite neu laden</a></p></div>';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
