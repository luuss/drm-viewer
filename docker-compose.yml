services:
  tile-service:
    build:
      context: ./tile-service
    environment:
      CONVEX_URL: ${CONVEX_URL}
      TILE_SERVICE_SECRET: ${TILE_SERVICE_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    restart: unless-stopped

  import-worker:
    build:
      context: ./extract-service
    environment:
      CONVEX_SITE_URL: ${CONVEX_SITE_URL}
      EXTRACT_SERVICE_SECRET: ${EXTRACT_SERVICE_SECRET:-${TILE_SERVICE_SECRET}}
      PAGE_RENDER_WIDTH: ${PAGE_RENDER_WIDTH:-2400}
      EXTRACT_USE_LLM: ${EXTRACT_USE_LLM:-false}
      EXTRACT_LLM_PROVIDER: ${EXTRACT_LLM_PROVIDER:-anthropic}
      EXTRACT_LLM_MODEL: ${EXTRACT_LLM_MODEL:-}
      EXTRACT_LLM_API_KEY: ${EXTRACT_LLM_API_KEY:-}
      EXTRACT_LLM_BASE_URL: ${EXTRACT_LLM_BASE_URL:-}
      EXTRACT_LLM_ROUTING_ONLY: ${EXTRACT_LLM_ROUTING_ONLY:-}
      EXTRACT_LLM_ZDR: ${EXTRACT_LLM_ZDR:-true}
      EXTRACT_LLM_DATA_COLLECTION: ${EXTRACT_LLM_DATA_COLLECTION:-deny}
      EXTRACT_LLM_ALLOW_FALLBACKS: ${EXTRACT_LLM_ALLOW_FALLBACKS:-false}
      # Alte Installationen funktionieren weiter; neue nutzen EXTRACT_LLM_API_KEY.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
        VITE_TILE_SERVICE_URL: ${VITE_TILE_SERVICE_URL}
    ports:
      - "5173:80"
    depends_on:
      - tile-service
    restart: unless-stopped
